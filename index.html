<title>Довідник АТС</title>
<style>
:root{--bg:#0b1722;--card:#16304a;--ink:#e8f0f7;--mut:#a7bccd;--acc:#6bb6f0;--line:#24435f;--red:#ef6a5b;--edge:#0f2a42;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 24px 40px}
h1{font-size:26px;font-weight:700;margin:0 0 22px;letter-spacing:.2px;text-align:center}
.t{font-weight:650;font-size:16.5px;line-height:1.25;letter-spacing:.1px}.s{font-size:13.5px;line-height:1.35;color:var(--mut);margin-top:3px}

#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#17466d 0%,#0f2a43 55%,#08172a 100%);color:#fff;text-align:center;overflow:hidden;transition:opacity .5s}
#sp.off{opacity:0;pointer-events:none}
.rg{position:absolute;left:50%;top:40%;border:1.5px solid rgba(107,182,240,.35);border-radius:50%;transform:translate(-50%,-50%)}
.rg:nth-child(1){width:180px;height:180px}.rg:nth-child(2){width:340px;height:340px}.rg:nth-child(3){width:520px;height:520px}.rg:nth-child(4){width:720px;height:720px}
.sw{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:conic-gradient(from 0deg,rgba(107,182,240,0) 0deg,rgba(107,182,240,.28) 60deg,rgba(107,182,240,0) 62deg);animation:rot 3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.lg{position:relative;width:128px;height:128px;border-radius:30px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.12);animation:pop .8s cubic-bezier(.2,1.3,.4,1) both}
.lg img{height:100px;width:auto}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#sp h2{position:relative;margin:6px 0 0;font-size:28px;letter-spacing:.3px;animation:up .7s .35s both}
#sp p{position:relative;margin:0;font-size:14px;color:#9cc6e8;letter-spacing:2px;text-transform:uppercase;animation:up .7s .55s both}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.bar{position:relative;width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:100%;background:#6bb6f0;transform-origin:left;animation:ld 3s linear both}
.cp{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.3;letter-spacing:.6px;color:#9cc6e8;animation:up .7s .8s both}.cp span:last-child{opacity:.75;letter-spacing:1.2px}
@keyframes ld{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.sw,.lg,#sp h2,#sp p,.cp{animation:none}a.m{transition:none}}
</style><link rel="stylesheet" href="ui.css"></head><body><div id="sp"><div class="sw"></div><i class="rg"></i><i class="rg"></i><i class="rg"></i><i class="rg"></i>
<div class="lg"><img src="img/logo.png" alt="Украерорух"></div><h2>Довідник ATC</h2><p>ICAO · EMG</p><div class="bar"><i></i></div><div class="cp"><span>Copyright 2026</span><span>xxxviom</span></div></div>
<script>(function(){var e=document.getElementById("sp"),k=0;try{k=sessionStorage.getItem("sp")}catch(x){}
if(k){e.remove();return}try{sessionStorage.setItem("sp","1")}catch(x){}
setTimeout(function(){e.classList.add("off");setTimeout(function(){e.remove()},500)},3000)})()</script>
