:root{--bg:#f3f6f9;--card:#fff;--ink:#12212f;--mut:#5d7083;--acc:#0f5f9c;--line:#d9e2ea;--ph:#e4ecf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1722;--card:#13273a;--ink:#e6eef5;--mut:#8fa5b8;--acc:#6bb6f0;--line:#223a50;--ph:#1a3248}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line);z-index:2}
header a{color:var(--acc);text-decoration:none;font-weight:600;font-size:14px}
h1{font-size:19px;margin:4px 0 8px}
input{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.f{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.f button{flex:none;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
.f button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#cnt{font-size:13px;color:var(--mut);margin-top:6px}
main{max-width:760px;margin:0 auto;padding:10px 14px 30px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.p{aspect-ratio:16/9;background:var(--ph);display:grid;place-items:center;font-size:40px;color:var(--mut)}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.b{padding:12px 14px}
.tt{display:flex;gap:8px;align-items:center;justify-content:space-between}
.n{font-weight:700;font-size:17px}
.cd{font:700 14px ui-monospace,Menlo,monospace;background:var(--acc);color:var(--bg);border-radius:6px;padding:3px 7px;flex:none}
.w{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 6px;margin-top:6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:10px 0;font-size:14px}
.g div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}.g .k span:last-child{font-weight:700;text-align:right}.g span:first-child{color:var(--mut)}
.b a{color:var(--acc);font-size:14px;font-weight:600}
.em{text-align:center;color:var(--mut);padding:30px 0}
.ft{font-size:12px;color:var(--mut);margin-top:14px}
.r{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.r .th{width:64px;height:48px;flex:none;border-radius:6px;background:var(--ph);display:grid;place-items:center;overflow:hidden}.r img{width:100%;height:100%;object-fit:cover}.r small{display:block;color:var(--mut);font-size:13px}.sec{font-size:14px;color:var(--mut);margin:16px 0 8px}.bk{display:inline-block;margin-bottom:10px;color:var(--acc);font-weight:600;text-decoration:none}select{width:100%;font:inherit;padding:8px;margin:8px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.sb{font-size:13px;color:var(--mut)}.lk{display:flex;gap:16px;flex-wrap:wrap}.g+.g{margin-top:0;border-top:1px solid var(--line);padding-top:8px}[hidden]{display:none!important}
